[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ifp-platform"
version = "0.1.0"
description = "IFP 意图形式化平台：把业务规则从自然语言变成机器可校验的模型"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "IFP Maintainers" }]
keywords = ["ifp", "formal-methods", "smt", "ddd", "domain-modeling", "business-rules"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "lark>=1.1",
  "z3-solver>=4.12",
  "typer>=0.12",
  "rich>=13.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "build>=1.2"]

[project.scripts]
ifp = "ifp.cli:app"

[project.urls]
Homepage = "https://github.com/midongsang/ifp-platform"
Repository = "https://github.com/midongsang/ifp-platform"
Issues = "https://github.com/midongsang/ifp-platform/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/ifp"]

[tool.hatch.build.targets.wheel.force-include]
"src/ifp/py.typed" = "ifp/py.typed"

[tool.hatch.build.targets.sdist]
include = ["src/ifp", "examples", "docs", "specs", "tests", "editors", "README.md", "LICENSE"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "C4", "PIE", "SIM", "RUF"]
# E501：行宽由 formatter 负责；B008：Typer 要求在默认参数中调用 typer.Option/Argument
# RUF001/002/003：中文文档字符串与注释中的全角字符是有意为之，非歧义字符错误
ignore = ["E501", "B008", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
