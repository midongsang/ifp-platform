name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: 发布发行版
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 校验标签与包版本一致
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(python -c "import tomllib,pathlib;print(tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version'])")"
          if [ "$tag" != "$version" ]; then
            echo "::error::标签 ${GITHUB_REF_NAME} 与 pyproject.toml 的版本 ${version} 不一致"
            exit 1
          fi

      - name: 构建制品（sdist + wheel）
        run: |
          python -m pip install --upgrade pip
          pip install build
          python -m build

      - name: 校验 wheel 内容（含 py.typed 与 DSL 资源）
        run: |
          python -c "import glob, zipfile, sys; names = zipfile.ZipFile(glob.glob('dist/*.whl')[0]).namelist(); required = ['ifp/py.typed', 'ifp/grammar.lark', 'ifp/webassets/index.html']; missing = [n for n in required if n not in names]; sys.exit('wheel 缺少: ' + str(missing)) if missing else print('wheel 内容校验通过')"

      - name: 创建 GitHub Release 并上传安装资产
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" \
            --notes-file RELEASE_NOTES.md
