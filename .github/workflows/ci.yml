name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Unit tests
        run: pytest

  example:
    name: 退款域端到端示例
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: 类型检查 + Lint
        run: ifp check examples/refund/

      - name: 场景仿真
        run: ifp simulate examples/refund/

      - name: 属性测试（期望发现基线不变量反例）
        run: |
          if ifp verify examples/refund/refund.ifp; then
            echo "::error::应发现超额退款反例，但 verify 返回成功"
            exit 1
          else
            echo "已按预期发现反例（verify 返回非零）"
          fi

      - name: 导出制品
        run: ifp export examples/refund/refund.ifp --format openapi -o out/refund.openapi.json

  gate:
    name: 语义门禁（模型变更风险）
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      MODEL_ROOT: examples/refund
    outputs:
      risk_score: ${{ steps.gate.outputs.risk_score }}
      approval_required: ${{ steps.gate.outputs.approval_required }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: 取出基线模型（base 分支）
        run: |
          git worktree add --detach base "${{ github.event.pull_request.base.sha }}"

      - name: 语义 Diff 与审批判定
        id: gate
        run: |
          mkdir -p out
          ifp diff base/"$MODEL_ROOT" "$MODEL_ROOT" \
            --github \
            --json out/semantic-gate.json \
            --audit out/audit.jsonl
          echo "已生成语义门禁报告 out/semantic-gate.json"

      - name: 硬门禁（基线变更 / 风险超阈值则阻断合并）
        run: |
          if ifp diff base/"$MODEL_ROOT" "$MODEL_ROOT" --fail-on-approval > /dev/null; then
            echo "模型变更风险在阈值内，允许合并"
          else
            echo "::error::模型变更需强制审批（基线不变量变更或风险分值超阈值），请补充审批后合并"
            exit 1
          fi

      - name: 归档审计日志与门禁报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semantic-gate
          path: |
            out/semantic-gate.json
            out/audit.jsonl
          if-no-files-found: warn

  build:
    name: 打包（sdist + wheel）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build backend
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: 构建制品
        run: python -m build

      - name: 校验 wheel 内容（含 py.typed 与 DSL 资源）
        run: |
          python -c "import glob, zipfile, sys; names = zipfile.ZipFile(glob.glob('dist/*.whl')[0]).namelist(); required = ['ifp/py.typed', 'ifp/grammar.lark', 'ifp/webassets/index.html']; missing = [n for n in required if n not in names]; sys.exit('wheel 缺少: ' + str(missing)) if missing else print('wheel 内容校验通过')"

      - name: 安装 wheel 并冒烟验证 CLI
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --quiet dist/*.whl
          /tmp/smoke/bin/ifp version

